name: E2E Tests

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d91f340399fb2345e3e45f5461e116862b08261d
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@e29e0ecd235838be5f2e823f8f512a72dc55f662

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git for CI
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Build and start services with Docker Compose
        run: docker compose up -d --build --wait
        env:
          BUILDX_BAKE_GHA_CACHE_FROM: type=local,src=/tmp/.buildx-cache
          BUILDX_BAKE_GHA_CACHE_TO: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Debug service state
        if: always()
        run: |
          docker compose ps
          docker compose logs

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run Cypress E2E tests
        run: npm run cypress:run:docker
        timeout-minutes: 10
        env:
          CYPRESS_BASE_URL: http://localhost:8081
          CYPRESS_API_BASE_URL: http://localhost:8081
          CYPRESS_GIT_PROXY_URL: http://localhost:8000
          CYPRESS_GIT_SERVER_TARGET: git-server:8443

      - name: Dump git-proxy logs on failure
        if: failure()
        run: docker compose logs git-proxy --tail=100

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
        if: always()

      - name: Stop services
        if: always()
        run: docker compose down -v
